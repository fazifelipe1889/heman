<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#0f0f1a"/>
  <!-- Floor (prominent — this IS the bench replacement) -->
  <line x1="10" y1="155" x2="190" y2="155" stroke="#3f3f46" stroke-width="3"/>
  <!-- Floor texture lines -->
  <line x1="20" y1="160" x2="35" y2="160" stroke="#27272a" stroke-width="1"/>
  <line x1="50" y1="160" x2="65" y2="160" stroke="#27272a" stroke-width="1"/>
  <line x1="80" y1="160" x2="95" y2="160" stroke="#27272a" stroke-width="1"/>
  <line x1="110" y1="160" x2="125" y2="160" stroke="#27272a" stroke-width="1"/>
  <line x1="140" y1="160" x2="155" y2="160" stroke="#27272a" stroke-width="1"/>
  <line x1="165" y1="160" x2="180" y2="160" stroke="#27272a" stroke-width="1"/>
  <!-- Chest highlight -->
  <ellipse cx="113" cy="150" rx="24" ry="6" fill="rgba(239,68,68,0.4)"/>
  <!-- Person lying on floor (no bench) -->
  <!-- Legs: flat on floor, knees bent (elbows hit floor at bottom of movement) -->
  <line x1="67" y1="152" x2="46" y2="154" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="154" x2="50" y2="154" stroke="#d4d4d8" stroke-width="2" stroke-linecap="round"/>
  <!-- Knee bend -->
  <line x1="46" y1="154" x2="54" y2="136" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="54" y1="136" x2="70" y2="152" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Torso on floor -->
  <line x1="67" y1="152" x2="148" y2="152" stroke="#d4d4d8" stroke-width="3" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="157" cy="147" r="9" fill="none" stroke="#d4d4d8" stroke-width="2"/>
  <!-- Elbows resting on floor (key floor press detail) -->
  <circle cx="93" cy="155" r="3.5" fill="#52525b" stroke="#71717a" stroke-width="1.5"/>
  <circle cx="128" cy="155" r="3.5" fill="#52525b" stroke="#71717a" stroke-width="1.5"/>
  <!-- Arms extended up to bar -->
  <line x1="93" y1="152" x2="88" y2="108" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="128" y1="152" x2="135" y2="108" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Barbell -->
  <line x1="12" y1="108" x2="188" y2="108" stroke="#9ca3af" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Left plates -->
  <rect x="11" y="98" width="8" height="20" rx="2" fill="#6b7280"/>
  <rect x="5" y="101" width="7" height="14" rx="1.5" fill="#4b5563"/>
  <!-- Right plates -->
  <rect x="181" y="98" width="8" height="20" rx="2" fill="#6b7280"/>
  <rect x="188" y="101" width="7" height="14" rx="1.5" fill="#4b5563"/>
</svg>
