<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#0f0f1a"/>
  <!-- Floor -->
  <line x1="10" y1="170" x2="190" y2="170" stroke="#27272a" stroke-width="2"/>
  <!-- Bench legs -->
  <rect x="32" y="125" width="6" height="43" rx="1" fill="#3f3f46"/>
  <rect x="154" y="125" width="6" height="43" rx="1" fill="#3f3f46"/>
  <rect x="26" y="165" width="18" height="4" rx="2" fill="#3f3f46"/>
  <rect x="148" y="165" width="18" height="4" rx="2" fill="#3f3f46"/>
  <!-- Bench pad -->
  <rect x="29" y="117" width="134" height="9" rx="3" fill="#52525b"/>
  <rect x="29" y="117" width="134" height="4" rx="3" fill="#71717a"/>
  <!-- Chest highlight -->
  <ellipse cx="113" cy="116" rx="24" ry="7" fill="rgba(239,68,68,0.4)"/>
  <!-- Person: legs -->
  <line x1="67" y1="117" x2="44" y2="146" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="146" x2="56" y2="168" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Person: torso -->
  <line x1="67" y1="117" x2="148" y2="117" stroke="#d4d4d8" stroke-width="3" stroke-linecap="round"/>
  <!-- Person: head -->
  <circle cx="157" cy="112" r="9" fill="none" stroke="#d4d4d8" stroke-width="2"/>
  <!-- Arms extended up -->
  <line x1="107" y1="117" x2="88" y2="72" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="123" y1="117" x2="140" y2="72" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Barbell -->
  <line x1="12" y1="72" x2="188" y2="72" stroke="#9ca3af" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Left plates -->
  <rect x="11" y="62" width="8" height="20" rx="2" fill="#6b7280"/>
  <rect x="5" y="65" width="7" height="14" rx="1.5" fill="#4b5563"/>
  <!-- Right plates -->
  <rect x="181" y="62" width="8" height="20" rx="2" fill="#6b7280"/>
  <rect x="188" y="65" width="7" height="14" rx="1.5" fill="#4b5563"/>
  <!-- LEFT CHAIN hanging from bar (zigzag pattern) -->
  <polyline points="22,72 19,80 24,88 19,96 24,104 19,112 24,120 20,130 22,140 19,152 22,162 19,170"
    stroke="#a16207" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chain links left (small circles) -->
  <circle cx="21" cy="80" r="2" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="21" cy="96" r="2" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="21" cy="112" r="2" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="21" cy="128" r="2" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="21" cy="144" r="2" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="21" cy="160" r="2" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
  <!-- RIGHT CHAIN hanging from bar -->
  <polyline points="178,72 181,80 176,88 181,96 176,104 181,112 176,120 180,130 178,140 181,152 178,162 181,170"
    stroke="#a16207" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chain links right -->
  <circle cx="179" cy="80" r="2" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="179" cy="96" r="2" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="179" cy="112" r="2" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="179" cy="128" r="2" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="179" cy="144" r="2" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="179" cy="160" r="2" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
</svg>
