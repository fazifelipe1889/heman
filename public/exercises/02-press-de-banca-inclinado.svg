<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#0f0f1a"/>
  <!-- Floor -->
  <line x1="10" y1="170" x2="190" y2="170" stroke="#27272a" stroke-width="2"/>
  <!-- Bench seat -->
  <rect x="40" y="133" width="42" height="7" rx="2" fill="#52525b"/>
  <rect x="40" y="133" width="42" height="3" rx="2" fill="#71717a"/>
  <!-- Bench back pad (inclined ~35°) -->
  <line x1="79" y1="137" x2="161" y2="83" stroke="#52525b" stroke-width="9" stroke-linecap="round"/>
  <line x1="79" y1="135" x2="161" y2="81" stroke="#71717a" stroke-width="3" stroke-linecap="round"/>
  <!-- Support legs -->
  <line x1="54" y1="140" x2="46" y2="170" stroke="#3f3f46" stroke-width="5" stroke-linecap="round"/>
  <line x1="66" y1="140" x2="74" y2="170" stroke="#3f3f46" stroke-width="5" stroke-linecap="round"/>
  <line x1="117" y1="116" x2="117" y2="170" stroke="#3f3f46" stroke-width="5" stroke-linecap="round"/>
  <!-- Person: legs -->
  <line x1="60" y1="138" x2="42" y2="163" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="42" y1="163" x2="54" y2="168" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Person: torso (on incline) -->
  <line x1="60" y1="138" x2="153" y2="84" stroke="#d4d4d8" stroke-width="3" stroke-linecap="round"/>
  <!-- Person: head -->
  <circle cx="160" cy="78" r="9" fill="none" stroke="#d4d4d8" stroke-width="2"/>
  <!-- Chest highlight (upper portion of torso, rotated) -->
  <ellipse cx="136" cy="98" rx="18" ry="7" fill="rgba(239,68,68,0.4)" transform="rotate(-31, 136, 98)"/>
  <!-- Arms extended up (perpendicular to inclined torso) -->
  <line x1="140" y1="94" x2="116" y2="50" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="148" y1="89" x2="162" y2="50" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Barbell -->
  <line x1="12" y1="50" x2="188" y2="50" stroke="#9ca3af" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Left plates -->
  <rect x="11" y="41" width="8" height="18" rx="2" fill="#6b7280"/>
  <rect x="5" y="44" width="7" height="12" rx="1.5" fill="#4b5563"/>
  <!-- Right plates -->
  <rect x="181" y="41" width="8" height="18" rx="2" fill="#6b7280"/>
  <rect x="188" y="44" width="7" height="12" rx="1.5" fill="#4b5563"/>
</svg>
