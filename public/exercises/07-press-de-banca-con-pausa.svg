<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#0f0f1a"/>
  <!-- Floor -->
  <line x1="10" y1="170" x2="190" y2="170" stroke="#27272a" stroke-width="2"/>
  <!-- Bench legs -->
  <rect x="32" y="125" width="6" height="43" rx="1" fill="#3f3f46"/>
  <rect x="154" y="125" width="6" height="43" rx="1" fill="#3f3f46"/>
  <rect x="26" y="165" width="18" height="4" rx="2" fill="#3f3f46"/>
  <rect x="148" y="165" width="18" height="4" rx="2" fill="#3f3f46"/>
  <!-- Bench pad -->
  <rect x="29" y="117" width="134" height="9" rx="3" fill="#52525b"/>
  <rect x="29" y="117" width="134" height="4" rx="3" fill="#71717a"/>
  <!-- Chest highlight -->
  <ellipse cx="113" cy="116" rx="24" ry="7" fill="rgba(239,68,68,0.4)"/>
  <!-- Person: legs -->
  <line x1="67" y1="117" x2="44" y2="146" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="146" x2="56" y2="168" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Person: torso -->
  <line x1="67" y1="117" x2="148" y2="117" stroke="#d4d4d8" stroke-width="3" stroke-linecap="round"/>
  <!-- Person: head -->
  <circle cx="157" cy="112" r="9" fill="none" stroke="#d4d4d8" stroke-width="2"/>
  <!-- Arms BENT at ~90° — bar at chest level (paused position) -->
  <!-- Upper arms going outward and slightly down -->
  <line x1="107" y1="117" x2="84" y2="128" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="125" y1="117" x2="148" y2="128" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Forearms going up to bar at chest height -->
  <line x1="84" y1="128" x2="88" y2="108" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="148" y1="128" x2="138" y2="108" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Barbell resting at chest level (paused position) -->
  <line x1="12" y1="108" x2="188" y2="108" stroke="#9ca3af" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Left plates -->
  <rect x="11" y="98" width="8" height="20" rx="2" fill="#6b7280"/>
  <rect x="5" y="101" width="7" height="14" rx="1.5" fill="#4b5563"/>
  <!-- Right plates -->
  <rect x="181" y="98" width="8" height="20" rx="2" fill="#6b7280"/>
  <rect x="188" y="101" width="7" height="14" rx="1.5" fill="#4b5563"/>
  <!-- Pause indicator: two vertical bars -->
  <rect x="97" y="88" width="5" height="14" rx="1.5" fill="#fbbf24"/>
  <rect x="106" y="88" width="5" height="14" rx="1.5" fill="#fbbf24"/>
</svg>
