<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#0f0f1a"/>
  <!-- Floor -->
  <line x1="10" y1="170" x2="190" y2="170" stroke="#27272a" stroke-width="2"/>
  <!-- Bench back pad (declined ~20° — head goes lower to the right) -->
  <line x1="46" y1="94" x2="155" y2="140" stroke="#52525b" stroke-width="9" stroke-linecap="round"/>
  <line x1="46" y1="92" x2="155" y2="138" stroke="#71717a" stroke-width="3" stroke-linecap="round"/>
  <!-- Foot roller bar (upper-left end) -->
  <rect x="32" y="82" width="18" height="6" rx="2" fill="#52525b"/>
  <circle cx="35" cy="85" r="4" fill="none" stroke="#71717a" stroke-width="2"/>
  <circle cx="47" cy="85" r="4" fill="none" stroke="#71717a" stroke-width="2"/>
  <!-- Support legs -->
  <line x1="60" y1="108" x2="52" y2="170" stroke="#3f3f46" stroke-width="5" stroke-linecap="round"/>
  <line x1="148" y1="145" x2="148" y2="170" stroke="#3f3f46" stroke-width="5" stroke-linecap="round"/>
  <line x1="158" y1="145" x2="165" y2="170" stroke="#3f3f46" stroke-width="5" stroke-linecap="round"/>
  <!-- Person: feet hooked in roller -->
  <line x1="50" y1="94" x2="38" y2="84" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="56" y1="97" x2="44" y2="88" stroke="#d4d4d8" stroke-width="2" stroke-linecap="round"/>
  <!-- Person: torso (declined, head lower-right) -->
  <line x1="54" y1="97" x2="148" y2="138" stroke="#d4d4d8" stroke-width="3" stroke-linecap="round"/>
  <!-- Person: head (lower end, right side) -->
  <circle cx="156" cy="143" r="9" fill="none" stroke="#d4d4d8" stroke-width="2"/>
  <!-- Chest highlight -->
  <ellipse cx="108" cy="118" rx="20" ry="7" fill="rgba(239,68,68,0.4)" transform="rotate(22, 108, 118)"/>
  <!-- Arms extended up-right (perpendicular to declined body) -->
  <line x1="110" y1="115" x2="128" y2="76" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="122" y1="120" x2="145" y2="82" stroke="#d4d4d8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Barbell -->
  <line x1="12" y1="78" x2="188" y2="78" stroke="#9ca3af" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Left plates -->
  <rect x="11" y="69" width="8" height="18" rx="2" fill="#6b7280"/>
  <rect x="5" y="72" width="7" height="12" rx="1.5" fill="#4b5563"/>
  <!-- Right plates -->
  <rect x="181" y="69" width="8" height="18" rx="2" fill="#6b7280"/>
  <rect x="188" y="72" width="7" height="12" rx="1.5" fill="#4b5563"/>
</svg>
